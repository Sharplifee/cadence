# XcodeGen spec — no .xcodeproj is committed.
name: Cadence
options:
  bundleIdPrefix: com.connor.cadence
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  CadenceCore:
    path: .

schemes:
  # 4. A scheme that embeds the watch app plus `-destination generic/platform=iOS`
  # fails with "Supported platforms for the buildables in the current scheme is
  # empty". This iOS-only scheme exists purely so simulator builds and tests work.
  Cadence-iOS:
    build:
      targets:
        Cadence: all
    test:
      targets: [CadenceCoreTests]

targets:
  Cadence:
    type: application
    platform: iOS
    sources: [Cadence]
    dependencies:
      - package: CadenceCore
        product: CadenceCore
      - target: CadenceWatch
    settings:
      base:
        INFOPLIST_FILE: Cadence/Info.plist
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.cadence
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Cadence/Cadence.entitlements
        PROVISIONING_PROFILE_SPECIFIER: Cadence CI
        TARGETED_DEVICE_FAMILY: "1"

  CadenceWatch:
    type: application
    platform: watchOS
    sources: [CadenceWatch]
    dependencies:
      - package: CadenceCore
        product: CadenceCore
    settings:
      base:
        # 6. Both targets named Cadence produces "Multiple commands produce
        # Cadence.app". The product is renamed; the user still sees "Cadence"
        # via CFBundleDisplayName.
        PRODUCT_NAME: CadenceWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.cadence.watchkitapp
        SWIFT_VERSION: "5.9"
        PROVISIONING_PROFILE_SPECIFIER: Cadence Watch CI
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.connor.cadence
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
