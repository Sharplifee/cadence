# XcodeGen spec — no .xcodeproj is committed.
name: Cadence
options:
  bundleIdPrefix: com.connor.cadence
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  CadenceCore:
    path: .

schemes:
  # 4. A scheme that embeds the watch app plus `-destination generic/platform=iOS`
  # fails with "Supported platforms for the buildables in the current scheme is
  # empty". This iOS-only scheme exists purely so simulator builds work.
  #
  # Declaring any scheme suppresses XcodeGen's per-target auto-schemes, so this
  # is the ONLY scheme in the project and both the simulator build and the
  # archive use it. The watch app still ships: it is a dependency of the Cadence
  # target, so it is embedded either way.
  #
  # No test target here on purpose: CadenceCoreTests is a Swift Package test
  # target, and XcodeGen rejects it with "Scheme has invalid test target" since
  # it is not an Xcode target. The core suite runs on Linux in core.yml, which
  # is faster and free anyway.
  Cadence-iOS:
    build:
      targets:
        Cadence: all
    archive:
      config: Release

targets:
  Cadence:
    type: application
    platform: iOS
    sources: [Cadence]
    dependencies:
      - package: CadenceCore
        product: CadenceCore
      - target: CadenceWatch
    settings:
      base:
        INFOPLIST_FILE: Cadence/Info.plist
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.cadence
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Cadence/Cadence.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: SelfAttune CI
        MARKETING_VERSION: "0.2.0"
        TARGETED_DEVICE_FAMILY: "1"

  CadenceWatch:
    type: application
    platform: watchOS
    sources: [CadenceWatch]
    dependencies:
      - package: CadenceCore
        product: CadenceCore
    settings:
      base:
        # 6. Both targets named Cadence produces "Multiple commands produce
        # Cadence.app". The product is renamed; the user still sees "Cadence"
        # via CFBundleDisplayName.
        PRODUCT_NAME: CadenceWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.cadence.watchkitapp
        SWIFT_VERSION: "5.9"
        # An explicit Info.plist, not a generated one. Every watch key that
        # matters now lives in CadenceWatch/Info.plist where it can be read and
        # verified, instead of depending on which INFOPLIST_KEY_* settings Xcode
        # happens to honour.
        INFOPLIST_FILE: CadenceWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CODE_SIGN_ENTITLEMENTS: CadenceWatch/CadenceWatch.entitlements
        PROVISIONING_PROFILE_SPECIFIER: SelfAttune Watch CI
